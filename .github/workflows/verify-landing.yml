name: Verify live landing
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy landing page']
    types: [completed]
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser checks
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify preserved V1 page
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p screenshots
          node <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch();
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            const response=await page.goto('http://'+process.env.SSH_HOST+':8088/v1/',{waitUntil:'networkidle',timeout:30000});
            assert.equal(response.status(),200);
            assert.match(await page.title(),/Mind41/);
            assert.equal(await page.locator('.brand .logo svg').count(),3);
            const iconResponse=await page.request.get('http://'+process.env.SSH_HOST+':8088/mind41-symbol.svg');
            assert.equal(iconResponse.status(),200);
            assert.match(await iconResponse.text(),/<svg/);
            await page.locator('.thumb').first().scrollIntoViewIfNeeded();
            await page.waitForFunction(()=>[...document.querySelectorAll('.thumb img')].length===3 && [...document.querySelectorAll('.thumb img')].every(img=>img.complete&&img.naturalWidth>0));
            await page.locator('.thumb').first().locator('..').locator('..').screenshot({path:'screenshots/features.png'});
            for (const selector of ['.mockui','.security-visual','.faq-visual']) {
              await page.locator(selector).scrollIntoViewIfNeeded();
              await page.waitForFunction(selector=>{const img=document.querySelector(selector+' img');return img&&img.complete&&img.naturalWidth>0},selector);
              await page.locator(selector).screenshot({path:'screenshots/'+selector.slice(1)+'.png'});
            }
            await page.screenshot({path:'screenshots/desktop.png',fullPage:true});
            await page.setViewportSize({width:390,height:844});
            assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth),false,'Mobile horizontal overflow');
            assert.equal(await page.locator('.glow-card .icon').first().evaluate(e=>getComputedStyle(e).width),'112px');
            await page.screenshot({path:'screenshots/mobile.png',fullPage:true});
            await page.locator('.hamb').click();
            assert.equal(await page.locator('#mobile-menu').isVisible(),true);
            await page.locator('#mobile-menu [data-open]').click();
            assert.equal(await page.locator('.modal').isVisible(),true);
            assert.equal(await page.locator('#fullname').evaluate(e=>e===document.activeElement),true);
            await page.screenshot({path:'screenshots/registration.png'});
            await page.keyboard.press('Escape');
            assert.equal(await page.locator('.modal').isVisible(),false);
            await page.locator('#faq details').nth(1).locator('summary').click();
            assert.equal(await page.locator('#faq details').nth(1).getAttribute('open'),'');
            assert.equal(await page.locator('a[href="mailto:info@v41.vn"]').count(),2);
            assert.match(await page.locator('.cta-meta').innerText(),/Công ty Cổ phần Công nghệ Việt V41/);
            assert.match(await page.locator('.cta-meta').innerText(),/0111226605/);
            assert.match(await page.locator('.cta-meta').innerText(),/91 Trần Duy Hưng, Hà Nội/);
            await page.locator('.cta-meta').scrollIntoViewIfNeeded();
            await page.waitForFunction(()=>[...document.querySelectorAll('.v41-mark img')].length===1&&[...document.querySelectorAll('.v41-mark img')].every(i=>i.complete&&i.naturalWidth>0));
            await page.locator('.cta-panel').screenshot({path:'screenshots/company-mobile.png'});
            await page.setViewportSize({width:1440,height:1000});
            await page.locator('.cta-panel').screenshot({path:'screenshots/company-desktop.png'});
            assert.deepEqual(errors,[]);
            console.log('Live HTTP 200; desktop/mobile, menu, registration modal and FAQ checks passed.');
            await browser.close();
          })().catch(e=>{console.error(e.message);process.exit(1)});
          JS
      - name: Verify complete video transfer and decoding
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          curl --fail --retry 3 "http://${SSH_HOST}:8088/assets/mind41-gemini-v2-fixed.mp4" -o /tmp/mind41.mp4
          echo "0f15a35a13b6b11a243a697c51ca6c4d0c78d107e37cf4935b35e829f296a63a  /tmp/mind41.mp4" | sha256sum -c -
          ffmpeg -v error -xerror -i /tmp/mind41.mp4 -f null -
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,duration -of json /tmp/mind41.mp4
      - name: Verify hero intro video on V2
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch();
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            await page.goto('http://'+process.env.SSH_HOST+':8088/',{waitUntil:'networkidle'});
            const video=page.locator('#mind41-intro');
            assert.equal(await video.count(),1);
            await video.scrollIntoViewIfNeeded();
            await video.evaluate(v=>{v.load();});
            await page.waitForFunction(()=>document.querySelector('#mind41-intro').readyState>=2);
            assert.equal(await video.evaluate(v=>Math.round(v.duration)),20);
            assert.equal(await video.evaluate(v=>v.muted),false);
            await video.evaluate(v=>{v.muted=true;return v.play()});
            await page.waitForFunction(()=>document.querySelector('#mind41-intro').ended, {timeout:45000});
            assert.equal(await video.evaluate(v=>v.error),null);
            assert.ok(await video.evaluate(v=>v.currentTime)>=19.9);
            await video.evaluate(v=>v.pause());
            await page.locator('.hero-film').screenshot({path:'screenshots/video-desktop.png'});
            await page.setViewportSize({width:390,height:844});
            assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth),false);
            await page.locator('.hero-film').screenshot({path:'screenshots/video-mobile.png'});
            await page.goto('http://'+process.env.SSH_HOST+':8088/v2/',{waitUntil:'networkidle'});
            assert.equal(await page.locator('#mind41-intro').count(),1);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Verify capacity figures and product editor
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch();
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const base='http://'+process.env.SSH_HOST+':8088';
            await page.goto(base+'/',{waitUntil:'networkidle'});
            assert.equal(await page.locator('[data-capacity]').count(),5);
            assert.equal(await page.locator('.capacity-disclaimer').count(),0);
            assert.match(await page.locator('#capacity .eyebrow').innerText(),/tham khảo/);
            const config=await (await page.request.get(base+'/assets/capacity-data.json')).json();
            assert.equal(config.status,'dummy-unverified');
            await page.locator('#capacity').scrollIntoViewIfNeeded();
            await page.locator('#capacity').screenshot({path:'screenshots/capacity-desktop.png'});
            await page.locator('.capacity-editor summary').click();
            await page.locator('[name="documentsPerDay"]').fill('120');
            await page.locator('#capacity-form button[type="submit"]').click();
            assert.equal(await page.locator('[data-capacity="documentsPerDay"]').textContent(),'120');
            const downloadPromise=page.waitForEvent('download');
            await page.locator('#capacity-export').click();
            const download=await downloadPromise;
            const exported=JSON.parse(require('node:fs').readFileSync(await download.path(),'utf8'));
            assert.equal(exported.documentsPerDay,120);
            assert.equal(exported.status,'dummy-unverified');
            await page.locator('#capacity-reset').click();
            assert.equal(await page.locator('[data-capacity="documentsPerDay"]').textContent(),String(config.documentsPerDay));
            await page.setViewportSize({width:390,height:844});
            assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth),false);
            await page.locator('#capacity').screenshot({path:'screenshots/capacity-mobile.png'});
            await page.goto(base+'/v2/',{waitUntil:'networkidle'});
            assert.equal(await page.locator('[data-capacity]').count(),5);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-screenshots
          path: screenshots/
          retention-days: 7
